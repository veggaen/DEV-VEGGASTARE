name: E2E Tests (Playwright)

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'frontend/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Isolated interview happy path
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: veggat_ci
          POSTGRES_USER: veggat_ci
          POSTGRES_PASSWORD: disposable_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veggat_ci -d veggat_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: frontend
    # No repository/provider secrets and no configurable external base URL.
    # This job cannot perform a real payment or call a funded AI model.
    env:
      CI: 'true'
      VERCEL_ENV: preview
      DATABASE_URL_MAINPREVIEW: 'postgresql://veggat_ci:disposable_ci_only@127.0.0.1:5432/veggat_ci?sslmode=disable'
      AUTH_SECRET: 'disposable-ci-session-key-not-for-deployment'
      AUTH_URL: 'http://localhost:3000'
      NEXT_PUBLIC_APP_URL: 'http://localhost:3000'
      GATE_STATUS: 'false'
      EDGE_STORE_ACCESS_KEY: stub
      EDGE_STORE_SECRET_KEY: stub
      NEXT_PUBLIC_PUSHER_KEY: stub
      NEXT_PUBLIC_PUSHER_CLUSTER: eu
      RESEND_API_KEY: re_stub
      NODE_OPTIONS: '--max-old-space-size=8192'
      E2E_CI_SHOWCASE: '1'
      E2E_PRODUCTION_BUILD: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Initialize empty disposable catalog
        run: node scripts/setup-ci-showcase.mjs
      - name: Payment and credit policy regressions (providers mocked)
        run: npx vitest run lib/payments lib/ai-credit-purchase.test.ts lib/cart-credit-policy.test.ts lib/ci-database.test.ts
      - name: Strict production-style build
        run: npm run build -- --webpack
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Home → demo → product → cart → demo receipt
        run: npx playwright test e2e/suite.spec.ts --project=no-auth --grep 'CI showcase happy path' --retries=0
      - name: Upload test evidence
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: interview-happy-path
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
